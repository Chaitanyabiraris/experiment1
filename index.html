<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neumorphic Ping Pong</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1 class="title">PING PONG</h1>

    <div class="controls-section">
      <div class="control-group">
        <label for="mode">Mode:</label>
        <select id="mode">
          <option value="single">Single Player (vs CPU)</option>
          <option value="two">Two Players</option>
        </select>
      </div>

      <div class="control-group">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <button id="startBtn" class="btn btn-primary">Start Game</button>
      <button id="resetBtn" class="btn btn-secondary">Reset Scores</button>
    </div>

    <div class="game-container">
      <canvas id="game" width="800" height="400"></canvas>
      
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">Player 1</span>
          <div class="score-display" id="leftScore">0</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="score-box">
          <span class="score-label">Player 2</span>
          <div class="score-display" id="rightScore">0</div>
        </div>
      </div>
    </div>

    <div class="info-section">
      <p class="hint"><strong>Controls:</strong> Left Player: W (up) / S (down) | Right Player: ↑ (up) / ↓ (down)</p>
      <p class="status" id="gameStatus">Click "Start Game" to begin</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
