<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Retro Ping Pong</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="center">
    <h1 class="title">RETRO PING PONG</h1>

    <div class="controls">
      <label>
        Mode:
        <select id="mode">
          <option value="single">Single Player (vs CPU)</option>
          <option value="two">Two Players</option>
        </select>
      </label>

      <label>
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <button id="startBtn">Start Game</button>
      <button id="resetBtn">Reset Scores</button>
    </div>

    <div class="game-wrap">
      <canvas id="game" width="640" height="360"></canvas>
      <div class="scoreboard">
        <div class="score" id="leftScore">0</div>
        <div class="score" id="rightScore">0</div>
      </div>
    </div>

    <p class="hint">Left: W / S &nbsp; • &nbsp; Right: ↑ / ↓</p>
    <footer class="credit">Made with <span>⚡</span> — Retro style</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
